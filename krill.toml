# Krill.jl configuration
#
# Secrets use $VAR syntax — expanded at startup from environment or .env file.
# No secrets are stored directly in this file.

# ---------------------------------------------------------------------------
# LLM Provider
# ---------------------------------------------------------------------------

[provider]
name    = "openai"              # "openai" or "gemini"
model   = "gpt-5.4"
api_key = "$OPENAI_API_KEY"

# [provider]
# name    = "gemini"
# model   = "gemini-3.1-pro-preview"
# api_key = "$GEMINI_API_KEY"

# ---------------------------------------------------------------------------
# Channels — set enabled = true for each channel you want to run.
# All enabled channels start from a single process (bin/krill.jl).
# ---------------------------------------------------------------------------

[telegram]
enabled    = true
bot_token  = "$TELEGRAM_BOT_TOKEN"
allow_from = ["*"]              # Telegram user IDs, or "*" for everyone

[discord]
enabled    = false
bot_token  = "$DISCORD_BOT_TOKEN"
allow_from = ["*"]              # Discord user snowflakes, or "*" for everyone

# ---------------------------------------------------------------------------
# Runtime paths
# ---------------------------------------------------------------------------

[llm]
workspace                     = "context"
data_dir                      = "$KRILL_DATA_DIR"
builtin_restrict_to_workspace = false

# ---------------------------------------------------------------------------
# Profile — agent identity and tool toggles
# ---------------------------------------------------------------------------

[profile]
system_prompt = """\
You are Krill — a personal AI assistant. Your personality, communication style, \
and values are defined in SOUL.md. Tool selection rules are in AGENTS.md. \
Per-tool documentation is in TOOLS.md. Follow those documents.\
"""

[profile.tools]
provider_builtins    = true    # provider web search + code interpreter
local_builtins       = true
builtin_skills       = true
memory               = true
memory_consolidation = true
cron                 = true
subagents            = true
exec                 = true
claude_code          = true
claude_code_model    = "sonnet"
codex                = true
codex_model          = ""
google_workspace     = true
history_summarization = false

# ---------------------------------------------------------------------------
# MCP servers (add as many [[profile.mcp]] blocks as needed)
# ---------------------------------------------------------------------------

[[profile.mcp]]
name      = "filesystem"
transport = "stdio"
command   = "npx"
args      = ["-y", "@modelcontextprotocol/server-filesystem", "context"]

[[profile.mcp]]
name      = "github"
transport = "streamable_http"
url       = "https://api.githubcopilot.com/mcp/"
[profile.mcp.headers]
Authorization  = "Bearer $GH_PAT"
X-MCP-Readonly = "true"

[[profile.mcp]]
name      = "langchain"
transport = "streamable_http"
url       = "https://docs.langchain.com/mcp"
