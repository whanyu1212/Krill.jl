name: Deploy to Compute Engine

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: false
        default: "main"

env:
  PROJECT_ID: fleet-anagram-244304
  REGION: asia-southeast1
  IMAGE: asia-southeast1-docker.pkg.dev/fleet-anagram-244304/krill/krill
  VM_HOST: 35.198.209.223
  VM_USER: hanyuwu
  CONTAINER_NAME: krill

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Ensure Artifact Registry repository exists
        run: |
          gcloud artifacts repositories describe krill \
            --location=${{ env.REGION }} --quiet 2>/dev/null || \
          gcloud artifacts repositories create krill \
            --repository-format=docker \
            --location=${{ env.REGION }} \
            --description="Krill agent Docker images"

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} -t ${{ env.IMAGE }}:latest .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_KEY }}" > ~/.ssh/gce_key
          chmod 600 ~/.ssh/gce_key
          ssh-keyscan -H ${{ env.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VM
        run: |
          ssh -i ~/.ssh/gce_key ${{ env.VM_USER }}@${{ env.VM_HOST }} << 'EOF'
            # Authenticate Docker to pull from Artifact Registry
            gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

            # Pull the new image
            docker pull ${{ env.IMAGE }}:${{ github.sha }}

            # Stop and remove the old container if running
            docker stop ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            docker rm   ${{ env.CONTAINER_NAME }} 2>/dev/null || true

            # Start the new container
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart always \
              -e TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }} \
              -e DISCORD_BOT_TOKEN=${{ secrets.DISCORD_BOT_TOKEN }} \
              -e OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
              -e GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
              -e GH_PAT=${{ secrets.GH_PAT }} \
              -v $HOME/.krill:/root/.krill \
              ${{ env.IMAGE }}:${{ github.sha }}

            # Clean up old images to free disk space
            docker image prune -f
          EOF
